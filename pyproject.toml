[build-system]
requires = ["setuptools", "versioneer[toml]"]
build-backend = "setuptools.build_meta"

[project]
name = "alegra-e-provider"
dynamic = ["version"]
description = "Alegra E-Provider, Python Wrapper for Alegra Electronic Provider API"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Luis Martinez"}
]
keywords = ["alegra", "electronic-invoicing", "facturacion-electronica", "dian", "colombia", "api-client"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Accounting",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.10, <3.14"
dependencies = [
    "pydantic[email]==2.13.5",
    "requests==2.34.2",
    "httpx==0.28.1",
]

[project.urls]
Homepage = "https://github.com/acuasoft/alegra-e-provider"
Repository = "https://github.com/acuasoft/alegra-e-provider"
Issues = "https://github.com/acuasoft/alegra-e-provider/issues"
Changelog = "https://github.com/acuasoft/alegra-e-provider/releases"

[tool.setuptools.packages.find]
include = ["alegra", "alegra.*"]

[tool.versioneer]
VCS = "git"
style = "pep440"
versionfile_source = "alegra/_version.py"
versionfile_build = "_version.py"
tag_prefix = ""


[tool.ruff]
extend-exclude = [
    "alegra/_version.py",
    "versioneer.py"
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]